apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: cloudlab-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["cloudlab"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ["monitoring"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
  alerts.yml: |
    groups:
      - name: cloudlab
        rules:
          - alert: CloudlabApiDown
            expr: up{job="cloudlab-api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "cloudlab api 无法被 Prometheus 抓取"
              description: "Targets 中 cloudlab-api 为 down，请检查 Pod 与 /metrics。"
          - alert: CloudlabAppUnhealthy
            expr: app_up == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "短链服务 /health 不健康"
              description: "mysql_up 或 redis_up 为 0，对应健康探针失败场景。"
          - alert: CloudlabMysqlDown
            expr: mysql_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "MySQL 健康检查失败"
          - alert: CloudlabRedisDown
            expr: redis_up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Redis 健康检查失败"
