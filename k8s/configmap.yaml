# 部署后必须改为公网地址：PUBLIC_IP=x.x.x.x bash tools/cloud/patch-base-url.sh
# 或复制 configmap.cloud.example.yaml → configmap.cloud.yaml 后 apply
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-config
  namespace: cloudlab
data:
  APP_NAME: docker-cloud-lab
  BASE_URL: http://REPLACE_WITH_PUBLIC_IP:30080
  DEBUG: "false"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: root
  DB_NAME: cloudlab
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
