# 本机 Docker Desktop：BASE_URL 用 localhost + NodePort（见 README 8.6）。
# 云上公网：请用 configmap.cloud.example.yaml 或 patch BASE_URL（README 第 9 节）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudlab-config
  namespace: cloudlab
data:
  APP_NAME: docker-cloud-lab
  BASE_URL: http://localhost:30080
  DEBUG: "false"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: root
  DB_NAME: cloudlab
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
