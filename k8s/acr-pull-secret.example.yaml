# ACR 私有拉取（勿提交真实密码）
#
# 说明：
# - K8s 命名空间是 cloudlab / monitoring；ACR 命名空间是 zhou554_cloudlab（二者不同，正常）。
# - 清单里 image 使用 VPC 域名；Secret 的 --docker-server 必须与 image 主机名一致。
# - CI push 用公网域名；集群 pull 用 VPC 域名（见 README 9.5）。
#
# 推荐在 master 上创建（不要用本文件直接 apply，除非已填入 base64）：
#
#   REG_VPC="crpi-6zjjswgvnui3es9q-vpc.cn-hangzhou.personal.cr.aliyuncs.com"
#
#   kubectl -n cloudlab create secret docker-registry acr-pull \
#     --docker-server="${REG_VPC}" \
#     --docker-username=<ACR用户名> \
#     --docker-password=<ACR密码> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n monitoring create secret docker-registry acr-pull \
#     --docker-server="${REG_VPC}" \
#     --docker-username=<ACR用户名> \
#     --docker-password=<ACR密码> \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# k8s/ 与 monitoring/ 的 Deployment 已配置 imagePullSecrets: acr-pull。
# pause 镜像不在 Deployment 中，需在每台 k3s 节点配置 pause-image 与 registries.yaml（README 9.5）。
#
# 若仍要用手工 yaml：copy 为 acr-pull-secret.yaml（已 .gitignore），仅适用于 cloudlab 命名空间：
#
apiVersion: v1
kind: Secret
metadata:
  name: acr-pull
  namespace: cloudlab
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKER_CONFIG
