# 可选：worker 从 ACR 拉 api 镜像时使用（勿提交真实密码）
# 1. 在 ACR 控制台创建固定密码或 RAM 用户
# 2. copy 为 acr-pull-secret.yaml，填入 .dockerconfigjson 或改用：
#    kubectl -n cloudlab create secret docker-registry acr-pull \
#      --docker-server=registry.cn-hangzhou.aliyuncs.com \
#      --docker-username=xxx --docker-password=xxx
# 3. 在 api-deployment.yaml 的 spec.template.spec 增加：
#    imagePullSecrets:
#      - name: acr-pull
#
apiVersion: v1
kind: Secret
metadata:
  name: acr-pull
  namespace: cloudlab
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKER_CONFIG
