apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudlab
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql-pvc.yaml
  - mysql-deployment.yaml
  - mysql-service.yaml
  - redis-pvc.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - api-deployment.yaml
  - api-service.yaml
# Secret 不含在此。部署顺序：
#   kubectl apply -f k8s/namespace.yaml
#   kubectl apply -f k8s/secret.yaml
#   kubectl apply -k k8s/
